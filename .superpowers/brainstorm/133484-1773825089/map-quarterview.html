<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>쿼터뷰 고정 시점 - 맵 프리뷰</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a1a; overflow: hidden; font-family: sans-serif; }
  canvas { display: block; }
  #ui {
    position: fixed; top: 16px; left: 16px; z-index: 10;
    color: #e0e0e0; font-size: 14px;
    background: rgba(10,10,26,0.85); padding: 16px; border-radius: 8px;
    border: 1px solid #334;
  }
  #ui h2 { font-size: 18px; margin-bottom: 8px; color: #e94560; }
  #ui p { margin-bottom: 4px; color: #aaa; font-size: 13px; }
  #ui .highlight { color: #e9b44c; }
  #legend {
    position: fixed; bottom: 16px; left: 16px; z-index: 10;
    color: #e0e0e0; font-size: 13px;
    background: rgba(10,10,26,0.85); padding: 16px; border-radius: 8px;
    border: 1px solid #334;
  }
  #legend .item { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  #legend .color-box { width: 16px; height: 16px; border-radius: 3px; }
  #spawn-select {
    position: fixed; top: 16px; right: 16px; z-index: 10;
    color: #e0e0e0; font-size: 14px;
    background: rgba(10,10,26,0.85); padding: 16px; border-radius: 8px;
    border: 1px solid #334; min-width: 220px;
  }
  #spawn-select h3 { font-size: 15px; margin-bottom: 12px; color: #e94560; }
  .spawn-btn {
    display: block; width: 100%; padding: 10px 12px; margin: 6px 0;
    background: #16213e; color: #e0e0e0; border: 1px solid #334;
    border-radius: 6px; cursor: pointer; font-size: 13px; text-align: left;
  }
  .spawn-btn:hover { background: #1a3a5c; border-color: #e94560; }
  .spawn-btn.active { background: #e94560; color: #fff; border-color: #e94560; }
  .spawn-btn strong { display: block; font-size: 14px; margin-bottom: 2px; }
</style>
</head>
<body>
<div id="ui">
  <h2>쿼터뷰 고정 시점</h2>
  <p class="highlight">스타크래프트 / They Are Billions 스타일</p>
  <p>카메라 각도 고정, 이동만 가능</p>
  <p>마우스 드래그 또는 WASD/화살표: 팬</p>
  <p>스크롤: 줌 인/아웃</p>
</div>
<div id="legend">
  <div class="item"><div class="color-box" style="background:#e9b44c;"></div> ⭐ 거점 (코어)</div>
  <div class="item"><div class="color-box" style="background:#888;"></div> 🧱 벽</div>
  <div class="item"><div class="color-box" style="background:#e94560;"></div> 🏗️ 타워</div>
  <div class="item"><div class="color-box" style="background:#4a90d9;"></div> ⚔️ 병영</div>
  <div class="item"><div class="color-box" style="background:#2ecc71;"></div> ⛏️ 자원건물</div>
  <div class="item"><div class="color-box" style="background:#9b59b6;"></div> 🔬 특수건물</div>
  <div class="item"><div class="color-box" style="background:#c0392b;"></div> 💀 적 스폰</div>
</div>
<div id="spawn-select">
  <h3>적 스폰 방향</h3>
  <button class="spawn-btn" onclick="setSpawn('4dir')" id="btn-4dir">
    <strong>A: 4방향</strong> 사방에서 밀려옴. TAB 원작
  </button>
  <button class="spawn-btn" onclick="setSpawn('2dir')" id="btn-2dir">
    <strong>B: 2방향</strong> 양쪽에서만. 직관적
  </button>
  <button class="spawn-btn active" onclick="setSpawn('progressive')" id="btn-progressive">
    <strong>C: 점진적 확장</strong> 1방향→웨이브마다 추가
  </button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a1a);
scene.fog = new THREE.FogExp2(0x0a0a1a, 0.015);

// Isometric camera (OrthographicCamera for true isometric feel)
const frustumSize = 22;
const aspect = window.innerWidth / window.innerHeight;
const camera = new THREE.OrthographicCamera(
  -frustumSize * aspect / 2, frustumSize * aspect / 2,
  frustumSize / 2, -frustumSize / 2, 0.1, 100
);

// Fixed quarter-view angle (StarCraft/TAB style)
// ~35.264° elevation (arctan(1/√2)), 45° rotation
const ISO_ANGLE = Math.PI / 4; // 45° horizontal
const ISO_ELEVATION = Math.atan(1 / Math.sqrt(2)); // ~35.26°
const ISO_DISTANCE = 30;

let panX = 0, panZ = 0;

function updateCamera() {
  camera.position.set(
    panX + Math.cos(ISO_ANGLE) * Math.cos(ISO_ELEVATION) * ISO_DISTANCE,
    Math.sin(ISO_ELEVATION) * ISO_DISTANCE,
    panZ + Math.sin(ISO_ANGLE) * Math.cos(ISO_ELEVATION) * ISO_DISTANCE
  );
  camera.lookAt(panX, 0, panZ);
}
updateCamera();

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// Lights
scene.add(new THREE.AmbientLight(0x445566, 0.7));

const dirLight = new THREE.DirectionalLight(0xffeedd, 0.9);
dirLight.position.set(8, 20, 12);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(2048, 2048);
dirLight.shadow.camera.near = 0.5;
dirLight.shadow.camera.far = 60;
dirLight.shadow.camera.left = -25;
dirLight.shadow.camera.right = 25;
dirLight.shadow.camera.top = 25;
dirLight.shadow.camera.bottom = -25;
scene.add(dirLight);

// Subtle red point light at core
const coreLight = new THREE.PointLight(0xe9b44c, 0.6, 12);
coreLight.position.set(0, 3, 0);
scene.add(coreLight);

// Materials
const groundMat = new THREE.MeshLambertMaterial({ color: 0x1a472a });
const groundDarkMat = new THREE.MeshLambertMaterial({ color: 0x143a20 });
const wallMat = new THREE.MeshLambertMaterial({ color: 0x777777 });
const wallTopMat = new THREE.MeshLambertMaterial({ color: 0x999999 });
const towerMat = new THREE.MeshLambertMaterial({ color: 0xcc3355 });
const towerTopMat = new THREE.MeshLambertMaterial({ color: 0x992244 });
const barracksMat = new THREE.MeshLambertMaterial({ color: 0x4a90d9 });
const barracksRoofMat = new THREE.MeshLambertMaterial({ color: 0x3570aa });
const resourceMat = new THREE.MeshLambertMaterial({ color: 0x2ecc71 });
const specialMat = new THREE.MeshLambertMaterial({ color: 0x9b59b6 });
const coreMat = new THREE.MeshLambertMaterial({ color: 0xe9b44c });
const coreTopMat = new THREE.MeshLambertMaterial({ color: 0xd4a438 });
const spawnMat = new THREE.MeshLambertMaterial({ color: 0xc0392b, transparent: true, opacity: 0.5 });

// Ground
const GRID = 24;
for (let x = -GRID/2; x < GRID/2; x++) {
  for (let z = -GRID/2; z < GRID/2; z++) {
    const geo = new THREE.BoxGeometry(1, 0.1, 1);
    const mat = (x + z) % 2 === 0 ? groundMat : groundDarkMat;
    const tile = new THREE.Mesh(geo, mat);
    tile.position.set(x + 0.5, -0.05, z + 0.5);
    tile.receiveShadow = true;
    scene.add(tile);
  }
}

// Building helpers
function createWall(x, z) {
  const base = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.8, 0.9), wallMat);
  base.position.set(x, 0.4, z);
  base.castShadow = true;
  base.receiveShadow = true;
  scene.add(base);
  // battlement
  const top = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.2, 0.95), wallTopMat);
  top.position.set(x, 0.9, z);
  top.castShadow = true;
  scene.add(top);
}

function createTower(x, z) {
  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.5, 2.2, 8), towerMat);
  base.position.set(x, 1.1, z);
  base.castShadow = true;
  scene.add(base);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(0.55, 0.8, 8), towerTopMat);
  roof.position.set(x, 2.6, z);
  roof.castShadow = true;
  scene.add(roof);
}

function createBarracks(x, z) {
  const base = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.0, 1.6), barracksMat);
  base.position.set(x, 0.5, z);
  base.castShadow = true;
  scene.add(base);
  // roof
  const roof = new THREE.Mesh(new THREE.ConeGeometry(1.2, 0.6, 4), barracksRoofMat);
  roof.position.set(x, 1.3, z);
  roof.rotation.y = Math.PI / 4;
  roof.castShadow = true;
  scene.add(roof);
}

function createResource(x, z) {
  const base = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.7, 1.0), resourceMat);
  base.position.set(x, 0.35, z);
  base.castShadow = true;
  scene.add(base);
}

function createSpecial(x, z) {
  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 1.6, 6), specialMat);
  base.position.set(x, 0.8, z);
  base.castShadow = true;
  scene.add(base);
  const orb = new THREE.Mesh(new THREE.SphereGeometry(0.2, 12, 12), new THREE.MeshBasicMaterial({ color: 0xcc88ff }));
  orb.position.set(x, 1.8, z);
  scene.add(orb);
}

// === Build the colony ===

// Core
const coreBase = new THREE.Mesh(new THREE.BoxGeometry(2.2, 2.0, 2.2), coreMat);
coreBase.position.set(0, 1.0, 0);
coreBase.castShadow = true;
scene.add(coreBase);
const coreRoof = new THREE.Mesh(new THREE.ConeGeometry(1.8, 1.2, 4), coreTopMat);
coreRoof.position.set(0, 2.6, 0);
coreRoof.rotation.y = Math.PI / 4;
coreRoof.castShadow = true;
scene.add(coreRoof);
const coreGlow = new THREE.Mesh(
  new THREE.SphereGeometry(0.3, 16, 16),
  new THREE.MeshBasicMaterial({ color: 0xffee66 })
);
coreGlow.position.set(0, 3.4, 0);
scene.add(coreGlow);

// Inner walls (square around core)
for (let i = -3; i <= 3; i++) {
  createWall(i, -3);
  createWall(i, 3);
  if (Math.abs(i) > 0) {
    createWall(-3, i);
    createWall(3, i);
  }
}

// Outer walls
for (let i = -6; i <= 6; i++) {
  createWall(i, -6);
  createWall(i, 6);
  if (Math.abs(i) >= 1) {
    createWall(-6, i);
    createWall(6, i);
  }
}

// Towers at corners + midpoints
[[-3,-3],[3,-3],[-3,3],[3,3]].forEach(([x,z]) => createTower(x, z));
[[-6,-6],[6,-6],[-6,6],[6,6],[0,-6],[0,6],[-6,0],[6,0]].forEach(([x,z]) => createTower(x, z));

// Barracks
createBarracks(-2, -1.5);
createBarracks(2, 1.5);
createBarracks(1.5, -2);

// Resources
createResource(-1.5, 2);
createResource(2, -1);
createResource(-2, -2);
createResource(1, 2);

// Special buildings
createSpecial(-1, -1);
createSpecial(1, 1);

// Trees (decoration)
function createTree(x, z) {
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 0.5, 6), new THREE.MeshLambertMaterial({ color: 0x4a3728 }));
  trunk.position.set(x, 0.25, z);
  scene.add(trunk);
  const leaves = new THREE.Mesh(new THREE.ConeGeometry(0.35, 0.8, 6), new THREE.MeshLambertMaterial({ color: 0x1a5c2a }));
  leaves.position.set(x, 0.85, z);
  leaves.castShadow = true;
  scene.add(leaves);
}
for (let i = 0; i < 30; i++) {
  const angle = Math.random() * Math.PI * 2;
  const dist = 8 + Math.random() * 3;
  createTree(Math.cos(angle) * dist, Math.sin(angle) * dist);
}

// === Spawn zones ===
let spawnMeshes = [];

function clearSpawns() {
  spawnMeshes.forEach(m => scene.remove(m));
  spawnMeshes = [];
}

function addSpawnLine(x, z, w, d, opacity) {
  const geo = new THREE.BoxGeometry(w, 0.25, d);
  const mat = new THREE.MeshLambertMaterial({ color: 0xc0392b, transparent: true, opacity: opacity || 0.5 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, 0.13, z);
  scene.add(mesh);
  spawnMeshes.push(mesh);

  // Animated skull markers
  const count = Math.max(Math.floor(Math.max(w, d) / 2.5), 3);
  for (let i = 0; i < count; i++) {
    const skull = new THREE.Mesh(
      new THREE.OctahedronGeometry(0.2, 0),
      new THREE.MeshBasicMaterial({ color: opacity < 0.3 ? 0x661111 : 0xff3333 })
    );
    if (w > d) {
      skull.position.set(x - w/2 + (i+0.5) * (w/count), 0.5, z);
    } else {
      skull.position.set(x, 0.5, z - d/2 + (i+0.5) * (d/count));
    }
    skull.userData.baseY = skull.position.y;
    skull.userData.phase = Math.random() * Math.PI * 2;
    scene.add(skull);
    spawnMeshes.push(skull);
  }
}

function setSpawn(type) {
  clearSpawns();
  document.querySelectorAll('.spawn-btn').forEach(b => b.classList.remove('active'));

  if (type === '4dir') {
    document.getElementById('btn-4dir').classList.add('active');
    addSpawnLine(0, -11, 22, 1.2, 0.5);
    addSpawnLine(0, 11, 22, 1.2, 0.5);
    addSpawnLine(-11, 0, 1.2, 22, 0.5);
    addSpawnLine(11, 0, 1.2, 22, 0.5);
  } else if (type === '2dir') {
    document.getElementById('btn-2dir').classList.add('active');
    addSpawnLine(0, -11, 22, 1.2, 0.5);
    addSpawnLine(0, 11, 22, 1.2, 0.5);
  } else {
    document.getElementById('btn-progressive').classList.add('active');
    addSpawnLine(0, -11, 22, 1.2, 0.5);
    addSpawnLine(0, 11, 22, 1.2, 0.15);
    addSpawnLine(-11, 0, 1.2, 22, 0.15);
    addSpawnLine(11, 0, 1.2, 22, 0.15);
  }
}
setSpawn('progressive');

// === Enemies ===
const enemies = [];
function createEnemy(fx, fz) {
  const body = new THREE.Mesh(
    new THREE.SphereGeometry(0.22, 8, 8),
    new THREE.MeshLambertMaterial({ color: 0xdd2222 })
  );
  body.position.set(fx, 0.3, fz);
  body.castShadow = true;
  body.userData.speed = 0.008 + Math.random() * 0.012;
  body.userData.phase = Math.random() * Math.PI * 2;
  scene.add(body);
  enemies.push(body);
}

for (let i = 0; i < 20; i++) createEnemy(-10 + Math.random() * 20, -10 - Math.random());
for (let i = 0; i < 10; i++) createEnemy(-10 + Math.random() * 20, 10 + Math.random());
for (let i = 0; i < 6; i++) createEnemy(-10 - Math.random(), -8 + Math.random() * 16);

// === Controls: Pan only (no rotation) ===
let isDragging = false;
let prevMouse = { x: 0, y: 0 };
const keys = {};

renderer.domElement.addEventListener('mousedown', (e) => {
  isDragging = true;
  prevMouse = { x: e.clientX, y: e.clientY };
});
renderer.domElement.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const dx = e.clientX - prevMouse.x;
  const dy = e.clientY - prevMouse.y;
  // Pan in isometric-aligned directions
  panX -= (dx * 0.05 * Math.cos(ISO_ANGLE) + dy * 0.05 * Math.sin(ISO_ANGLE));
  panZ -= (-dx * 0.05 * Math.sin(ISO_ANGLE) + dy * 0.05 * Math.cos(ISO_ANGLE));
  prevMouse = { x: e.clientX, y: e.clientY };
  updateCamera();
});
renderer.domElement.addEventListener('mouseup', () => isDragging = false);
renderer.domElement.addEventListener('mouseleave', () => isDragging = false);

// Zoom
renderer.domElement.addEventListener('wheel', (e) => {
  const newSize = frustumSize + e.deltaY * 0.02;
  const clamped = Math.max(8, Math.min(40, newSize));
  camera.left = -clamped * aspect / 2;
  camera.right = clamped * aspect / 2;
  camera.top = clamped / 2;
  camera.bottom = -clamped / 2;
  camera.updateProjectionMatrix();
});

// Keyboard pan
window.addEventListener('keydown', (e) => keys[e.key] = true);
window.addEventListener('keyup', (e) => keys[e.key] = false);

// Animation
function animate() {
  requestAnimationFrame(animate);

  // Keyboard pan
  const panSpeed = 0.15;
  if (keys['w'] || keys['ArrowUp']) panZ -= panSpeed;
  if (keys['s'] || keys['ArrowDown']) panZ += panSpeed;
  if (keys['a'] || keys['ArrowLeft']) panX -= panSpeed;
  if (keys['d'] || keys['ArrowRight']) panX += panSpeed;
  updateCamera();

  // Enemy movement
  const t = Date.now() * 0.001;
  enemies.forEach(e => {
    const dx = panX - e.position.x;
    const dz = panZ - e.position.z;
    const dist = Math.sqrt(dx*dx + dz*dz);
    if (dist > 4) {
      e.position.x += (dx / dist) * e.userData.speed;
      e.position.z += (dz / dist) * e.userData.speed;
    }
    e.position.y = 0.3 + Math.sin(t * 3 + e.userData.phase) * 0.08;
  });

  // Core glow
  const pulse = 0.7 + Math.sin(t * 2) * 0.3;
  coreGlow.scale.set(pulse, pulse, pulse);
  coreLight.intensity = 0.4 + Math.sin(t * 2) * 0.2;

  // Spawn skull bob
  spawnMeshes.forEach(m => {
    if (m.userData.baseY !== undefined) {
      m.position.y = m.userData.baseY + Math.sin(t * 2 + m.userData.phase) * 0.15;
      m.rotation.y = t;
    }
  });

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  const a = window.innerWidth / window.innerHeight;
  camera.left = -frustumSize * a / 2;
  camera.right = frustumSize * a / 2;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
